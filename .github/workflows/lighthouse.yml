name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: lh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance / A11y / SEO budgets (${{ matrix.modo }})
    runs-on: ubuntu-latest
    # Informational: surfaces scores on every PR without blocking the merge.
    continue-on-error: true
    # Era 15, e o job passou a bater nele: duas tentativas seguidas no mesmo
    # commit foram canceladas aos 15m19s e 15m15s, depois de todo o dia a correr
    # em ~14m30s. Não é uma regressão de desempenho do site — é o job a crescer
    # (instalação + build + DUAS passagens do Lighthouse, secretária e
    # telemóvel), e um cancelamento não distingue "lento" de "avariado".
    #
    # 25 dá folga sem esconder crescimento: os orçamentos que reprovam a
    # qualidade continuam a ser os do lighthouserc, que não mexem aqui.
    #
    # ── E DEPOIS 25 TAMBÉM DEIXOU DE CHEGAR ───────────────────────────────────
    # O AVIF da galeria acrescentou ~13 minutos de encode ao `npm run build`, e
    # este job foi cancelado aos 25m14s. Pus a cache do pré-gerador nos dois
    # jobs do `ci.yml` e ESQUECI-ME deste — que também compila. É o mesmo
    # defeito, no terceiro sítio.
    #
    # 40 cobre uma corrida de cache fria (as três compilações do mesmo commit
    # arrancam juntas, portanto na primeira depois de mexer nas fotos nenhuma
    # tem cache) sem deixar de mostrar crescimento.
    timeout-minutes: 40
    # Desktop e telemóvel em dois jobs ao mesmo tempo (15/10): eram dois passos
    # seguidos, 7 + 6 minutos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - modo: desktop
            config: lighthouserc.json
          - modo: telemóvel
            config: lighthouserc.mobile.json
    steps:
      - uses: actions/checkout@v4

      # A mesma preparação dos outros jobs — e por isso a MESMA chave da cache
      # das miniaturas. A deste ficheiro não incluía o `pregen-logos.mjs` e só
      # acertava pelo `restore-keys`.
      - uses: ./.github/actions/preparar
        with:
          construir: "true"

      - name: Run Lighthouse CI (${{ matrix.modo }})
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=${{ matrix.config }}

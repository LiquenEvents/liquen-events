name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: lh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance / A11y / SEO budgets
    runs-on: ubuntu-latest
    # Informational: surfaces scores on every PR without blocking the merge.
    continue-on-error: true
    # Era 15, e o job passou a bater nele: duas tentativas seguidas no mesmo
    # commit foram canceladas aos 15m19s e 15m15s, depois de todo o dia a correr
    # em ~14m30s. Não é uma regressão de desempenho do site — é o job a crescer
    # (instalação + build + DUAS passagens do Lighthouse, secretária e
    # telemóvel), e um cancelamento não distingue "lento" de "avariado".
    #
    # 25 dá folga sem esconder crescimento: os orçamentos que reprovam a
    # qualidade continuam a ser os do lighthouserc, que não mexem aqui.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run Lighthouse CI (desktop)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=lighthouserc.json

      - name: Run Lighthouse CI (mobile)
        run: lhci autorun --config=lighthouserc.mobile.json

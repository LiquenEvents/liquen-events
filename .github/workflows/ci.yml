name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Este job faz install + audit + lint + typecheck + ~2900 testes + um build
    # completo do Next (que inclui a pré-geração de 172 imagens). Em 2026-08-05
    # levou 15m14s e o GitHub matou-o a meio do build — e um esgotamento de
    # tempo aparece como "cancelled", que se lê como "alguém cancelou" e não
    # como "avaria". Custou-me uma diagnose inteira a perceber que não era
    # código nenhum.
    #
    # A corrida anterior tinha levado 11m37s. Ou seja: o tecto estava a três
    # minutos e meio do trabalho real, e a variação normal de velocidade dos
    # runners chega para o ultrapassar. 25 minutos volta a dar folga sem
    # deixar um job encravado a arder durante meia hora.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Fall back to npm install if the lockfile is out of sync with sharp's
        # platform-specific optional deps (a known cross-platform npm quirk).
        run: npm ci || npm install

      - name: Audit dependencies (fail on high/critical)
        # Audit only what ships to users (production deps). The dev toolchain
        # (eslint & its plugins) currently pulls a transitive brace-expansion
        # advisory via minimatch that has no non-breaking fix and never reaches
        # the deployed site; --omit=dev keeps the gate meaningful for runtime
        # dependencies without blocking on dev-only tooling advisories.
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Keep the production build self-contained; real secrets are injected
          # by the deploy platform, not needed for a type-safe build.
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # O `continue-on-error` DESCEU DO JOB PARA O PASSO informativo, e é a única
    # razão por que este ficheiro foi tocado.
    #
    # Enquanto estava aqui em cima, NENHUM teste E2E podia pôr um PR vermelho —
    # a suite corria e o resultado era decorativo. Era essa a peça mecânica que
    # faltava por trás da queixa "as fotos falham imenso": mesmo que existisse um
    # teste a apanhar uma imagem partida (e não existia), o CI deixava-a passar à
    # mesma. A rede de segurança das imagens (e2e/imagens.spec.ts, títulos com
    # `@imagens`) passa a correr num passo próprio e BLOQUEANTE; o resto da suite
    # fica exactamente como estava, informativo, no passo anterior.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Corre primeiro o resto da suite (informativo). Se corresse depois do
      # passo bloqueante, uma falha nas imagens saltava-o por completo.
      - name: Run E2E tests (informational)
        continue-on-error: true
        run: npx playwright test --grep-invert "@imagens|@movel"
        env:
          CI: "true"
          # Test-only admin auth so the back-office smoke can log in against the
          # production `next start` server (which otherwise disables login).
          # Hash is the already-committed dev hash for the public "liquen2026"
          # password — no real secret; the session secret is throwaway.
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. A ergonomia táctil do back office num iPhone SE (375 px,
      # toque ligado): alvos de 44x44 px, campos com letra >= 16 px, nada de
      # conteúdo para lá da margem direita, e nada de focável fora do ecrã. As
      # quatro regras e os limiares estão
      # em e2e/ergonomia-tactil.mjs, partilhados com o varrimento que produz o
      # relatório (scripts/auditar-toque-admin.mjs), para o CI e o relatório
      # nunca discordarem.
      #
      # Bloqueante e não informativo porque isto regride sozinho: basta alguém
      # escrever `py-1.5` num botão novo. Um passo que avisa e deixa passar é um
      # passo que se ignora — e a dona trabalha no telemóvel.
      #
      # Corre à parte do passo de cima (que é `continue-on-error`) pela mesma
      # razão que as passkeys: senão a falha ficava enterrada num passo que não
      # pára nada.
      - name: Ergonomia táctil no telemóvel (bloqueante)
        run: npx playwright test --grep "@movel"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. A entrada por passkey, com um autenticador virtual do
      # Chrome: assinaturas a sério, verificadas pelo servidor a sério. Corre
      # com config própria porque precisa de GRAVAR, e o servidor de produção
      # que os outros passos usam recusa escritas sem Supabase — a razão está
      # escrita em playwright.passkeys.config.ts. Bloqueante porque isto é
      # autenticação: um caminho de entrada partido não pode passar em silêncio.
      - name: Passkeys — registar, entrar sem palavra-passe, e remover
        run: npm run test:e2e:passkeys
        env:
          CI: "true"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. Uma imagem que não pinte em qualquer página, em telemóvel ou
      # em computador, com o menu fechado ou aberto, põe o PR vermelho. Corre em
      # último para o relatório HTML que fica no artefacto ser o desta rede.
      - name: Imagens — nenhuma imagem partida em nenhuma página
        run: npx playwright test --grep "@imagens"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

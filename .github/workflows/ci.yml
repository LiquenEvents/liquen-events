name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A verificação COMPLETA também corre todas as noites e à mão (a escolha
  # dela de 15/10: «inteligente + completa depois» — ver `decidir`).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # AS VERIFICAÇÕES CORREM EM PARALELO (15/10)
  # ════════════════════════════════════════════════════════════════════════
  #
  # Palavras dela: «porque é que demora muito?… tornar tudo super eficiente,
  # super rápido… para que não estejamos à espera muito tempo». Cada PR
  # esperava ~28 minutos, e a medição (gh api, PRs #228 e #229) disse onde:
  # o job E2E corria ONZE invocações do Playwright umas atrás das outras, e a
  # primeira — a informativa, que nem pode pôr o PR vermelho — levava 12 dos
  # 28 minutos. Os testes unitários levavam 9 a 12 num só processo.
  #
  # O trabalho é o MESMO, nenhum teste saiu nem se salta; só deixou de esperar
  # em fila. Cada parte é um job com o seu runner, o começo de todos é a acção
  # `.github/actions/preparar`, e dois jobs finais — com os NOMES DE SEMPRE,
  # «Lint · Typecheck · Test · Build» e «E2E (Playwright)» — só passam se
  # todas as suas partes passarem. Assim, se o GitHub exigir esses nomes para
  # juntar, continua a exigi-los com o mesmo significado. Os números e o
  # porquê de cada job estão em `docs/VERIFICACOES.md`.

  # ── O QUE ESTA MUDANÇA PRECISA DE VERIFICAR (15/10, 2.ª volta) ──────────
  # Ela escolheu «inteligente + completa depois»: num PR corre o que a mudança
  # pode afectar — os testes de unidade ligados a um ficheiro mudado, e os
  # passeios da área que ela toca; em `push` ao `main`, à noite e à mão corre
  # TUDO. A regra é `scripts/ci/o-que-correr.mjs`, com um teste por caso; na
  # dúvida, tudo.
  decidir:
    name: O que verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tudo: ${{ steps.d.outputs.tudo }}
      unidade: ${{ steps.d.outputs.unidade }}
      sitio: ${{ steps.d.outputs.sitio }}
      back_office: ${{ steps.d.outputs.back_office }}
      e2e: ${{ steps.d.outputs.e2e }}
      ligados: ${{ steps.d.outputs.ligados }}
    steps:
      - uses: actions/checkout@v4
      - name: Os ficheiros que o PR muda
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > ficheiros-do-pr.txt
      - name: Decidir
        id: d
        env:
          EVENTO: ${{ github.event_name }}
          FICHEIROS_DO_PR_EM: ficheiros-do-pr.txt
        run: |
          touch ficheiros-do-pr.txt
          node scripts/ci/o-que-correr.mjs

  estatico:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    # (Até 15/10 este job também corria os testes de unidade — ver `unitarios`.)
    # Este job faz install + audit + lint + typecheck + ~2900 testes + um build
    # completo do Next (que inclui a pré-geração de 172 imagens). Em 2026-08-05
    # levou 15m14s e o GitHub matou-o a meio do build — e um esgotamento de
    # tempo aparece como "cancelled", que se lê como "alguém cancelou" e não
    # como "avaria". Custou-me uma diagnose inteira a perceber que não era
    # código nenhum.
    #
    # A corrida anterior tinha levado 11m37s. Ou seja: o tecto estava a três
    # minutos e meio do trabalho real, e a variação normal de velocidade dos
    # runners chega para o ultrapassar. 25 minutos volta a dar folga sem
    # deixar um job encravado a arder durante meia hora.
    #
    # 2026-08: sobe para 35. O AVIF ao lado do WebP levou o pré-gerador de ~2
    # para ~13 minutos numa cache fria, e este job passou a 20m03s — a três
    # minutos do tecto outra vez. A cache abaixo devolve os 13 minutos na
    # maioria das corridas; o tecto cobre a primeira corrida depois de entrar
    # uma fotografia nova, que paga o encode na mesma.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar

      - name: Audit dependencies (fail on high/critical)
        # Audit only what ships to users (production deps). The dev toolchain
        # (eslint & its plugins) currently pulls a transitive brace-expansion
        # advisory via minimatch that has no non-breaking fix and never reaches
        # the deployed site; --omit=dev keeps the gate meaningful for runtime
        # dependencies without blocking on dev-only tooling advisories.
        run: npm audit --audit-level=high --omit=dev

      # A cache do lint e do typecheck: entre corridas só se volta a ver o que
      # mudou. A chave muda com a configuração e as dependências; o
      # `restore-keys` traz a última, e a ferramenta revê o que for diferente.
      - name: Cache do lint e do typecheck
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            .tsbuildinfo-ci
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            lint-tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'tsconfig.json') }}-

      # Os dois ao mesmo tempo: não dependem um do outro.
      - name: Lint e typecheck
        run: |
          npx eslint --cache --cache-location .eslintcache --cache-strategy content &
          lint=$!
          npx tsc --noEmit --incremental --tsBuildInfoFile .tsbuildinfo-ci &
          tsc=$!
          wait $lint; l=$?
          wait $tsc; t=$?
          echo "lint=$l typecheck=$t"
          test $l -eq 0 && test $t -eq 0

      - name: Build
        run: npm run build
        env:
          # Keep the production build self-contained; real secrets are injected
          # by the deploy platform, not needed for a type-safe build.
          NEXT_TELEMETRY_DISABLED: "1"

      # A proposta que o casal abre nunca teve tecto de peso, e não podia ter
      # pela via do browser: para a medir é preciso uma proposta gravada, e o
      # servidor de produção recusa escritas sem Supabase, de propósito. Este
      # guião lê o manifesto que o próprio build escreve por rota — sem
      # servidor, sem dados, sem rede. Corre AQUI porque é aqui que o `.next`
      # que ele lê acaba de nascer.
      - name: Peso das rotas (bloqueante)
        run: node scripts/peso-das-rotas.mjs

  # Os testes de unidade, em cinco partes ao mesmo tempo (`vitest --shard`).
  # Num PR, só os LIGADOS a um ficheiro mudado (`vitest related`, o grafo de
  # imports do próprio vitest); depois de juntar, todos. Os dois ficheiros
  # gigantes (o estúdio, ~6 min sozinho, e o `montar`) correm em partes —
  # `test/em-partes.ts`.
  unitarios:
    name: Testes unitários (${{ matrix.parte }}/5)
    needs: decidir
    if: needs.decidir.outputs.unidade != 'nada'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          miniaturas: "false"

      - name: Unit tests
        env:
          UNIDADE: ${{ needs.decidir.outputs.unidade }}
          LIGADOS: ${{ needs.decidir.outputs.ligados }}
        run: |
          # Os caminhos têm `[lang]` e `(admin)`: sem globbing, ficam tal e qual.
          set -f
          comum="--shard=${{ matrix.parte }}/5 --passWithNoTests --reporter=default --reporter=json --outputFile.json=vitest.json"
          if [ "$UNIDADE" = "tudo" ] || [ -z "$LIGADOS" ]; then
            npx vitest run $comum
          else
            npx vitest related $LIGADOS --run $comum
          fi

      - name: Totais desta parte
        if: always()
        run: node scripts/ci/totais.mjs vitest vitest.json "Unidade ${{ matrix.parte }}/5"

  quality:
    name: Lint · Typecheck · Test · Build
    # O nome de sempre: passa só se o lint, o typecheck, o build e as partes
    # dos testes passarem — ou se foram saltadas porque o `decidir` (que tem de
    # ter passado) disse que a mudança não lhes chega.
    needs: [decidir, estatico, unitarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todas as partes passaram?
        run: |
          echo "decidir=${{ needs.decidir.result }} estatico=${{ needs.estatico.result }} unitarios=${{ needs.unitarios.result }}"
          test "${{ needs.decidir.result }}" = success || exit 1
          for r in "${{ needs.estatico.result }}" "${{ needs.unitarios.result }}"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # ── O PACOTE DAS MINIATURAS, PARA A VERCEL ──────────────────────────────
  # A 13/10 nenhum deploy acabava: a Vercel restaurou uma cache de build sem
  # as miniaturas da galeria, e o pré-gerador pôs-se a codificar ~1000 fotos
  # numa máquina de 2 núcleos (hora e meia; a Vercel corta aos 45 minutos).
  # Esta cache — a do job de cima — está sempre quente. Fica publicada como
  # um ficheiro do repositório (a release `pregen-cache`), e o
  # `scripts/pregen-gallery.mjs` descarrega-a quando lhe faltam fotos.
  # Só se publica quando a cache mudou (a chave vai nas notas da release).
  pacote-das-miniaturas:
    name: Pacote das miniaturas (para a Vercel)
    needs: quality
    # Só ramos deste repositório: um fork não tem, nem pode ter, escrita.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: A cache que o build acabou de deixar
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache/pregen-gallery
            .next/cache/pregen-logos
          key: pregen-${{ runner.os }}-${{ hashFiles('public/imagens/**', 'scripts/pregen-gallery.mjs', 'scripts/pregen-logos.mjs') }}
      - name: Publicar o pacote, se mudou
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE: pregen-${{ runner.os }}-${{ hashFiles('public/imagens/**', 'scripts/pregen-gallery.mjs', 'scripts/pregen-logos.mjs') }}
        run: |
          set -euo pipefail
          atual="$(gh release view pregen-cache --json body --jq .body 2>/dev/null || true)"
          if [ "$atual" = "$CHAVE" ]; then
            echo "O pacote publicado já é este ($CHAVE)."
            exit 0
          fi
          tar -cf pregen-gallery.tar -C .next/cache/pregen-gallery .
          ls -la pregen-gallery.tar
          if ! gh release view pregen-cache >/dev/null 2>&1; then
            gh release create pregen-cache --prerelease --latest=false \
              --title "Miniaturas da galeria (cache de build)" --notes "$CHAVE"
          fi
          gh release upload pregen-cache pregen-gallery.tar --clobber
          gh release edit pregen-cache --notes "$CHAVE"

  # ── O RESTO DA SUITE E2E, INFORMATIVO, À PARTE ──────────────────────────
  # Era o primeiro passo do job E2E e levava 12 dos ~28 minutos que um PR
  # esperava — sem poder pôr nada vermelho (`continue-on-error` no passo). Corre
  # agora em três jobs paralelos, ao lado dos que bloqueiam, e continua igual:
  # o resultado vê-se, e não pára nada.
  e2e-informativo:
    name: E2E informativo (${{ matrix.parte }}/4)
    needs: decidir
    if: needs.decidir.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: "true"
          construir: "true"

      # Corre primeiro o resto da suite (informativo). Se corresse depois do
      # passo bloqueante, uma falha nas imagens saltava-o por completo.
      - name: Run E2E tests (informational)
        continue-on-error: true
        # `@propostas` corre no seu próprio passo bloqueante, com config e
        # servidor próprios — aqui só duplicaria trabalho, e falharia, porque
        # este servidor é o de produção e recusa escritas sem Supabase.
        run: npx playwright test --grep-invert "@imagens|@movel|@propostas|@galeria|@desempenho|@movimento|@semrede|@vidro" --shard=${{ matrix.parte }}/4
        env:
          CI: "true"
          # Test-only admin auth so the back-office smoke can log in against the
          # production `next start` server (which otherwise disables login).
          # Hash is the already-committed dev hash for the public "liquen2026"
          # password — no real secret; the session secret is throwaway.
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

  # BLOQUEANTE, em dois jobs: os 118 passeios das imagens, metade em cada.
  e2e-imagens:
    name: E2E · imagens (${{ matrix.parte }}/3)
    needs: decidir
    if: needs.decidir.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: "true"
          construir: "true"

      # BLOQUEANTE. Uma imagem que não pinte em qualquer página, em telemóvel ou
      # em computador, com o menu fechado ou aberto, põe o PR vermelho. Corre em
      # três jobs paralelos (`--shard`), cada um com um terço dos passeios.
      - name: Imagens — nenhuma imagem partida em nenhuma página
        run: npx playwright test --grep "@imagens" --shard=${{ matrix.parte }}/3 --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright.json
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      - name: Totais desta parte
        if: always()
        run: node scripts/ci/totais.mjs playwright playwright.json "Imagens ${{ matrix.parte }}/3"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-imagens-${{ matrix.parte }}
          path: playwright-report/
          retention-days: 7

  # BLOQUEANTE. Os passos curtos contra o servidor de PRODUÇÃO (`next start`):
  # cada um é de segundos, e juntos cabem num job.
  e2e-producao:
    name: E2E · peso, galeria, molas, vidro, sem rede
    needs: decidir
    if: needs.decidir.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: "true"
          construir: "true"

      # BLOQUEANTE. O PESO DO BACK OFFICE, que até aqui não era medido por
      # ninguém: os orçamentos do `lighthouserc.json` cobrem seis páginas e são
      # todas do sítio público. O painel que ela abre todos os dias no telemóvel
      # nunca teve teto nenhum.
      #
      # Mede BYTES e número de pedidos, e não milissegundos: o tempo desta
      # máquina não diz nada sobre um 4G de quinta, mas os bytes que se mandam
      # são os mesmos nos dois sítios. Um teto em tempo seria um vermelho que
      # aparece quando o runner está ocupado — e um vermelho que não quer dizer
      # nada é um vermelho que se aprende a ignorar.
      #
      # Bloqueante porque isto regride em silêncio: uma biblioteca nova entra
      # com uma funcionalidade e ninguém volta a olhar para o número.
      - name: Peso do back office (bloqueante)
        run: npx playwright test --grep "@desempenho"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. A galeria é a montra do negócio e recebe tráfego pago: uma
      # regressão de peso aqui custa dinheiro em duas frentes (converte menos E
      # o Índice de Qualidade sobe o custo por clique). Estes testes guardam a
      # CAUSA de cada ganho medido — o tecto de resolução por classe de ecrã, a
      # ordem AVIF/WebP, o placeholder e a caixa reservada.
      #
      # Bloqueante e não informativo porque a regressão é INVISÍVEL: a galeria
      # continua a parecer bem com fotos três vezes maiores do que precisa. Foi
      # exactamente assim que ela chegou a 55 MB por travessia sem ninguém dar
      # por isso — e um passo que avisa e deixa passar é um passo que se ignora.
      - name: Desempenho da galeria (bloqueante)
        run: npx playwright test --grep "@galeria"
        env:
          CI: "true"

      # BLOQUEANTE. AS MOLAS CHEGAM MESMO AO ELEMENTO — ou não chegam, e nada
      # nesta casa dava por isso.
      #
      # O movimento do back office tem quatro elos: a constante em
      # `ui/movimento.ts`, a classe que o Tailwind gera a partir do TEXTO do
      # ficheiro, a variável que essa classe lê no `:root`, e o que o browser
      # calcula. A suite de unidade só vê o primeiro. Numa única ronda
      # partiram-se o segundo e o terceiro, um a seguir ao outro:
      #
      #   · uma classe montada por interpolação — o valor certo em memória, e o
      #     Tailwind (que varre o texto, não corre o código) a não ver candidato
      #     nenhum: zero regras;
      #   · e, corrigida essa, `transition-duration: 0s` num botão real, porque
      #     o `@theme` poda o que ninguém usa e o `globals.css` — a única folha
      #     que emite `:root` — não varre a pasta do back office.
      #
      # Nenhum dos dois deu erro de compilação, aviso do lint ou teste vermelho.
      # Os dois têm a mesma assinatura: o CSS fica com a REGRA e sem o VALOR, e
      # só um browser a que se pergunte os vê.
      #
      # Bloqueante e não informativo porque a avaria é MUDA — os botões
      # continuam a parecer bem, só deixam de se mexer — e um passo que avisa e
      # deixa passar é um passo que se ignora. Não grava nada, portanto corre
      # contra o servidor de produção deste job sem precisar de Supabase.
      # O `@movimento` cresceu para lá do nome: além das molas, leva agora o modo
      # escuro (fase 03) e os cursores semânticos (fase 07). Todos partilham a
      # mesma assinatura de avaria — o CSS fica com a regra e sem o efeito, e só
      # um browser a que se pergunte os vê — e por isso partilham o passo.
      - name: O que só um browser vê — molas, modo escuro, ponteiro (bloqueante)
        run: npx playwright test --grep "@movimento"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. O VIDRO DEIXA PASSAR — ou não deixa, e continua a parecer
      # que sim.
      #
      # Ela mandou as barras do Instagram e do WhatsApp no iOS 26 e disse «o
      # menu no telemóvel não está assim». A barra tinha `backdrop-filter`, o
      # conteúdo passava mesmo por baixo dela, e mesmo assim não havia vidro
      # nenhum: a 0,80 de opacidade só 20% do que passava por trás chegava ao
      # olho — uma caixa branca com um desfoque que ninguém via.
      #
      # Nenhum teste desta casa podia apanhar isso, e não por descuido: os que
      # existiam medem a REGRA (as classes no `globals.css`, os contrastes
      # calculados a partir dos tokens) e a regra estava certa. A transmissão
      # não está escrita em lado nenhum do CSS — é o produto do α da superfície
      # com o que estiver por trás dela nesse fotograma, e só existe depois de
      # o browser compor as duas camadas.
      #
      # É a mesma assinatura do passo de cima, e por isso corre da mesma
      # maneira: o CSS fica com a regra e sem o efeito, e só um browser a que
      # se pergunte o vê. Este mede o pixel — põe uma sonda de cor conhecida
      # por trás da barra e exige que o que se vê através dela mude.
      #
      # Bloqueante e não informativo porque a regressão é MUDA e barata de
      # fazer: basta alguém subir a opacidade de um token para a barra voltar a
      # ser tinta, e continua a parecer bem em qualquer captura. Não grava
      # nada, portanto corre contra o servidor de produção deste job sem
      # precisar de Supabase.
      - name: O vidro deixa passar (bloqueante)
        run: npx playwright test --grep "@vidro"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # O `public/sw.js` guarda o invólucro das páginas para que uma visita sem
      # rede ainda veja o sítio. Faltava medir a outra metade: que o que volta
      # esteja VIVO. Se o JavaScript não pegar, o que aparece é uma fotografia
      # do ecrã — o menu não abre e não se vai a sítio nenhum.
      #
      # TEM de ser aqui, contra o servidor de PRODUÇÃO, e não na suite dos
      # dados: desde o Next 16.3.3 o `next dev` não hidrata uma página devolvida
      # pela cache do service worker sem rede (medido nos três: `next start`
      # hidrata, o `next dev` da 16.2.11 hidratava, o da 16.3.3 não). Correr
      # este guarda em dev seria medir o servidor de desenvolvimento em vez do
      # produto.
      #
      # Bloqueante porque a regressão é MUDA: a página continua a aparecer
      # inteira em qualquer captura de ecrã, e só quem lhe toca descobre que
      # está morta. Não grava nada, portanto o servidor de produção deste job
      # basta.
      - name: Sem rede, o ecrã volta vivo (bloqueante)
        run: npx playwright test --grep "@semrede"
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-producao
          path: playwright-report/
          retention-days: 7

  # BLOQUEANTE. Os passeios que GRAVAM, com o servidor de desenvolvimento
  # (cada config arranca o seu `npm run dev`): não precisam do build.
  e2e-dados:
    name: E2E · dados (${{ matrix.parte }}/3)
    needs: decidir
    if: needs.decidir.outputs.back_office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Em três partes: cada uma tem o seu runner, o seu servidor `dev` e os seus
    # dados — o `workers: 1` da config continua verdadeiro dentro de cada uma.
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: "true"

      # BLOQUEANTE. Os passeios que precisam de GRAVAR — e que por isso têm
      # servidor próprio (`playwright.dados.config.ts` explica porquê). O
      # `npm run test:e2e:dados` existia no package.json e não era corrido em
      # lado nenhum: um passo que não corre é cobertura imaginária, que é o
      # defeito que aquele config foi escrito para acabar.
      #
      # É aqui que vive o `geometria-dos-alvos.spec.ts`: a barra «Guardar
      # alterações» que nascia fora do ecrã, a tira de totais que não cabia no
      # telemóvel, e os alvos de 13 px. Nenhum deles se vê sem navegador, e o
      # de Faturas nem sequer se vê sem uma fatura grande semeada.
      - name: Geometria e dados — os passeios que gravam (bloqueante)
        run: npm run test:e2e:dados -- --shard=${{ matrix.parte }}/3 --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright.json
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      - name: Totais desta parte
        if: always()
        run: node scripts/ci/totais.mjs playwright playwright.json "Dados ${{ matrix.parte }}/3"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dados-${{ matrix.parte }}
          path: playwright-report/
          retention-days: 7

  e2e-gravam:
    name: E2E · telemóvel, propostas, passkeys
    needs: decidir
    if: needs.decidir.outputs.back_office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          navegador: "true"

      # BLOQUEANTE. A ergonomia táctil do back office num iPhone SE (375 px,
      # toque ligado): alvos de 44x44 px, campos com letra >= 16 px, nada de
      # conteúdo para lá da margem direita, e nada de focável fora do ecrã. As
      # quatro regras e os limiares estão
      # em e2e/ergonomia-tactil.mjs, partilhados com o varrimento que produz o
      # relatório (scripts/auditar-toque-admin.mjs), para o CI e o relatório
      # nunca discordarem.
      #
      # Bloqueante e não informativo porque isto regride sozinho: basta alguém
      # escrever `py-1.5` num botão novo. Um passo que avisa e deixa passar é um
      # passo que se ignora — e a dona trabalha no telemóvel.
      #
      # Corre à parte do passo de cima (que é `continue-on-error`) pela mesma
      # razão que as passkeys: senão a falha ficava enterrada num passo que não
      # pára nada.
      # Config própria porque estes passeios CRIAM um pedido — precisam de um
      # cliente na lista para chegar ao estúdio — e o servidor de produção do
      # CI recusa escritas sem Supabase. Com o servidor de produção, o pedido
      # não chegava a gravar e a falha aparecia disfarçada de outra coisa
      # («main li button» não encontrado, trinta linhas à frente). A razão
      # está escrita em playwright.movel.config.ts.
      - name: Ergonomia táctil no telemóvel (bloqueante)
        run: npm run test:e2e:movel
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. Os dois fluxos de fazer uma proposta: do zero, e a partir
      # de outra. Config própria porque estes passeios CRIAM dados e o servidor
      # de produção do CI recusa escritas sem Supabase — a razão está escrita
      # em playwright.propostas.config.ts.
      #
      # Bloqueante porque o que o segundo passeio protege é a única forma de a
      # duplicação de propostas fazer mal em vez de bem: uma proposta enviada
      # com o nome ou a data do casamento de outro casal. Um passo que avisa e
      # deixa passar é um passo que se ignora.
      - name: Propostas — do zero, e a partir de outra
        run: npm run test:e2e:propostas
        env:
          CI: "true"
          ADMIN_PASSWORD_HASH: "$2b$10$eSAkm9hz/JUpFYWRdPrA9.YJP.Gjry2IwVwgZa3hjvHcvV/r27n7u"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      # BLOQUEANTE. A entrada por passkey, com um autenticador virtual do
      # Chrome: assinaturas a sério, verificadas pelo servidor a sério. Corre
      # com config própria porque precisa de GRAVAR, e o servidor de produção
      # que os outros passos usam recusa escritas sem Supabase — a razão está
      # escrita em playwright.passkeys.config.ts. Bloqueante porque isto é
      # autenticação: um caminho de entrada partido não pode passar em silêncio.
      - name: Passkeys — registar, entrar sem palavra-passe, e remover
        run: npm run test:e2e:passkeys
        env:
          CI: "true"
          SESSION_SECRET: "e2e-ci-session-secret-not-for-production-use"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gravam
          path: playwright-report/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    # O nome de sempre: passa só se todos os passeios que bloqueiam passarem. O informativo fica de fora, como sempre ficou.
    needs: [decidir, e2e-imagens, e2e-producao, e2e-dados, e2e-gravam]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todas as partes passaram?
        run: |
          echo "decidir=${{ needs.decidir.result }} e2e-imagens=${{ needs.e2e-imagens.result }} e2e-producao=${{ needs.e2e-producao.result }} e2e-dados=${{ needs.e2e-dados.result }} e2e-gravam=${{ needs.e2e-gravam.result }}"
          test "${{ needs.decidir.result }}" = success || exit 1
          for r in "${{ needs.e2e-imagens.result }}" "${{ needs.e2e-producao.result }}" "${{ needs.e2e-dados.result }}" "${{ needs.e2e-gravam.result }}"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # A história do tecto do job E2E antigo (para quem vier a seguir):
    # ── 60, E É A SEGUNDA VEZ QUE ESTE NÚMERO SOBE ────────────────────────
    #
    # A primeira foi 30 → 45: o job foi cancelado aos 30 minutos, a meio do
    # passo das imagens e com tudo o que já tinha corrido a passar, porque o
    # build à frente ficou ~13 minutos mais lento quando o AVIF entrou.
    #
    # Agora 45 → 60, e a avaria é a mesma com outra causa. O job foi cancelado
    # aos 45 minutos e 17 segundos, no teste 117 de 118 do passo das imagens,
    # com TODOS os 116 anteriores a verde. Não falhou nada: acabou o tempo.
    #
    # Os números que o dizem, das últimas seis corridas no `main`:
    #
    #     5a815c4c ... 41m38   ← a última antes desta
    #     e9c58e55 ... 39m51
    #     86726b58 ... 36m39
    #     3266b9f7 ... 36m58
    #     7a71d0ce ... 38m07
    #     21fb653b ... 31m36
    #
    # A suite cresce porque é assim que esta casa trabalha: cada avaria que
    # escapou deixa cá um guarda. Em três dias subiu de 31 para 41 minutos, e o
    # guarda que veio com este ramo — o texto sobre a fotografia da entrada —
    # foi o que a levou a passar dos 45.
    #
    # ── E PORQUE É QUE ISTO NÃO É UMA SOLUÇÃO, É UMA FOLGA ────────────────
    #
    # Levantar o tecto compra tempo, não o resolve: ao ritmo destes três dias,
    # os 60 chegam outra vez. O que resolve é reduzir o CUSTO, e a peça óbvia é
    # o passo das imagens — 118 passeios de ~3,5 s que abrem página a página,
    # sempre as mesmas. Isso é trabalho de outro ramo, não deste: um `timeout`
    # é uma linha, e refazer a estratégia do passo das imagens é uma mudança
    # que merece ser medida por si.
  # Desde 15/10 cada parte tem o seu job e o seu tecto de 30 minutos.

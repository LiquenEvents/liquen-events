<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem ligação — Líquen Events</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #f7f4ee;
        color: #1b2119;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      img {
        width: 88px;
        height: auto;
        opacity: 0.92;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: 0.01em;
      }
      p {
        max-width: 30rem;
        line-height: 1.6;
        color: #4a5347;
        font-size: 0.98rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.6rem;
        border: 1px solid #1b2119;
        border-radius: 999px;
        background: transparent;
        color: #1b2119;
        font: inherit;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      button:hover {
        background: #1b2119;
        color: #f7f4ee;
      }
    </style>
  </head>
  <body>
    <img src="/logo-liquen.png" alt="Líquen Events" />
    <h1>Sem ligação à Internet</h1>
    <p>
      Parece que ficou offline. Assim que a ligação voltar, as nossas páginas voltam a abrir
      normalmente — algumas já ficaram guardadas para consultar sem rede.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
